[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "student-task-manager"
version = "1.0.0"
description = "Cross-platform desktop task manager for students (Tkinter + SQLite)"
requires-python = ">=3.10"
dependencies = ["tkcalendar>=1.6.1", "platformdirs>=3.0"]

[project.gui-scripts]
student-task-manager = "student_task_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
